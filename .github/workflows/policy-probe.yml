name: Policy probe
on:
  push:
    branches: [ci-policy-probe]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Try to open a pull request with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr create --base main --head ci-policy-probe \
            --title "Policy probe (delete me)" \
            --body "Throwaway. Verifies GITHUB_TOKEN can call createPullRequest."
