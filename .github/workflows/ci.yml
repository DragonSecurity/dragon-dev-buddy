name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here needs to write anything back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the skill pack
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag. A tag is mutable;
      # this repo's own secrets-and-config-audit would flag anything less.
      # Renovate keeps the pins current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  bundle:
    name: Build the installable plugin
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build
        run: ./scripts/build-plugin.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragon-dev-buddy-plugin
          path: dist/dragon-dev-buddy.plugin
          if-no-files-found: error
