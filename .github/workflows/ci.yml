name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here needs to write anything back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the skill pack
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag. A tag is mutable;
      # this repo's own secrets-and-config-audit would flag anything less.
      # Renovate keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  bundle:
    name: Build the installable plugin
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        run: ./scripts/build-plugin.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dragon-dev-buddy-plugin
          path: dist/dragon-dev-buddy.plugin
          if-no-files-found: error
